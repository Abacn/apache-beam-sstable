[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "apache-beam-sstable"
version = "0.2.0.dev"
description = "High-performance Apache Beam Python SDK SSTable IO connector backed by C++ tsl::table"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Apache Beam Contributors" },
]
dependencies = [
    "apache-beam>=2.50.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.scikit-build]
cmake.version = ">=3.24"
cmake.build-type = "Release"
wheel.packages = ["src/apache_beam_sstable"]
minimum-version = "build-system.requires"

[tool.pytest.ini_options]
testpaths = ["src/apache_beam_sstable"]
python_files = ["*_test.py"]
